[package]
name = "inodetree"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Fast disk space analyzer"
license = "MIT"
repository = "https://github.com/Juanmidev1/inodetree"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
# eframe 0.37+ requires Rust 1.95, above the project MSRV of 1.85
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.32"
open = "5"
rayon = "1"
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Sizes and counters are deliberately narrowed to the compact arena field types
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/inodetree", dest = "/usr/bin/inodetree", mode = "0755" },
    { source = "assets/inodetree.desktop", dest = "/usr/share/applications/inodetree.desktop", mode = "0644" },
    { source = "assets/inodetree.svg", dest = "/usr/share/icons/hicolor/scalable/apps/inodetree.svg", mode = "0644" },
    { source = "LICENSE", dest = "/usr/share/doc/inodetree/LICENSE", mode = "0644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/inodetree/README.md", mode = "0644", doc = true },
]

# The GUI toolkit loads these with dlopen, so rpm cannot detect them from the ELF.
# Sonames are used instead of package names because those differ between Fedora and openSUSE.
[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
