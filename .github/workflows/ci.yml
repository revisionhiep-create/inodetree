name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-windows-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Built inside AlmaLinux 9 so the binary links against glibc 2.34 and installs on RHEL 9 and newer
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: almalinux:9
    steps:
      - name: Install build tools
        run: dnf install -y gcc git tar gzip rpm-build
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-${{ matrix.arch }}-
      - name: Check the tag matches the crate version
        run: |
          crate_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          # A pre-release tag such as v0.1.0-rc1 packages the 0.1.0 crate
          if [ "${tag_version%%-*}" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "VERSION=$crate_version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - run: cargo install cargo-generate-rpm --locked
      - run: cargo generate-rpm
      - name: Build tarball and checksums
        run: |
          name="inodetree-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name/assets"
          cp target/release/inodetree LICENSE README.md "dist/$name/"
          cp assets/inodetree.desktop assets/inodetree.svg "dist/$name/assets/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp target/generate-rpm/*.rpm dist/
          cd dist
          sha256sum "$name.tar.gz" ./*.rpm > "SHA256SUMS-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/SHA256SUMS-*

  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-windows-
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          crate_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version%%-*}" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "VERSION=$crate_version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - name: Package portable executable and checksums
        shell: bash
        run: |
          name="inodetree-${VERSION}-windows-x86_64"
          mkdir -p dist
          cp target/release/inodetree.exe "dist/${name}.exe"
          cd dist
          sha256sum "${name}.exe" > SHA256SUMS-windows
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS-*

  release:
    needs: [package, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          rm SHA256SUMS-*
          flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $flags \
            ./*.rpm ./*.tar.gz ./*.exe SHA256SUMS
